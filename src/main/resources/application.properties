spring.application.name=auth

# Secrets are NOT stored in this file. They are loaded from src/main/resources/secrets.properties (git ignored,
# see secrets.properties.example) or from the AUTH_* environment variables referenced below.
spring.config.import=optional:classpath:secrets.properties

# Do not auto-expose the JPA repositories (users, settings, tokens...) as REST endpoints, only the /api controllers are used
spring.data.rest.detection-strategy=annotated

# Comma separated allowed front end origins for CORS, e.g. https://app.example.com (default * = any)
spring.cors.allowed.origins=*

server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name =com.mysql.jdbc.Driver
spring.datasource.username=${AUTH_DB_USERNAME:}

spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/auth
#spring.datasource.url=jdbc:mysql://localhost:3306/charityauth

# SDD LDAP
spring.ldap.url=
spring.ldap.basedn=

spring.ldap.domain=
spring.ldap.register.role=true
spring.ldap.default.role=

spring.pass.default.role=User
spring.pass.register.role=false


# App JWT Properties
spring.app.jwtSecret=${AUTH_JWT_SECRET:}
spring.app.jwtExpirationMs=86400000
spring.app.jwtExpirationMs.short=7200000
spring.app.jwtExpirationMs.code=900000


spring.apikey=${AUTH_API_KEY:}
spring.apisecret=${AUTH_API_SECRET:}
spring.admin.key=${AUTH_ADMIN_KEY:}

spring.recaptcha.validation=false
spring.recaptcha.siteKey=${AUTH_RECAPTCHA_SITE_KEY:}
spring.recaptcha.api=${AUTH_RECAPTCHA_API:}

spring.messages.basename=messages
spring.messages.encoding=UTF-8
file.encoding=UTF-8

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AUTH_MAIL_USERNAME:}
spring.mail.password=${AUTH_MAIL_PASSWORD:}
spring.mail.starttls.enable=true
spring.mail.from=ts.charity25@gmail.com
spring.mail.auth=true
spring.mail.support=ts.charity25@gmail.com


#PROD
spring.sms.auth.api=
spring.sms.auth.username=${AUTH_SMS_AUTH_USERNAME:}
spring.sms.auth.password=${AUTH_SMS_AUTH_PASSWORD:}
spring.sms.api=
spring.sms.applicationId=
spring.sms.password=${AUTH_SMS_PASSWORD:}


spring.maximum.invalid.attempts=5



server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true


spring.uaepass.default.role=Test
spring.uaepass.register.role=true
spring.uaepass.username=${AUTH_UAEPASS_USERNAME:}
spring.uaepass.password=${AUTH_UAEPASS_PASSWORD:}
spring.uaepass.endpoint=https://stg-id.uaepass.ae/
spring.uaepass.callback.url=idshub/token?grant_type=authorization_code&redirect_uri=#CALLBACKURL#&code=#CODE#
spring.uaepass.userinfo.url=idshub/userinfo
spring.uaepass.state=testing
spring.uaepass.spsa.redirect.url=http://localhost/login#USERNAME#
spring.uaepass.auth.url=idshub/authorize?response_type=code&client_id=#CLIENTID#&scope=urn:uae:digitalid:profile:general&state=#STATE#&redirect_uri=#REDIRECTURL#&acr_values=urn:safelayer:tws:policies:authentication:level:low
spring.uaepass.use.eid=false

spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

spring.serverkey=${AUTH_SERVER_KEY:}
spring.serverpass=${AUTH_SERVER_PASS:}

spring.change.pass.url=https://internationalmissiondevie.org/dashboard/forgotpassword?u=#username#&changepass=#otpcode#

