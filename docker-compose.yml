# Local run: copy .env.example to .env, fill the values, then: docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      # seeds schema, roles, menus and settings on the first start (empty volume) only
      - ./src/main/resources/scripts/auth.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # database is only reachable from the app container (no host port published)

  auth:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/auth
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      # same context path as the Tomcat deployment (auth.war), the authorization table stores APIs as /auth/api/...
      SERVER_SERVLET_CONTEXT_PATH: /auth
    ports:
      - "8081:8081"

volumes:
  db-data:
